version: 2
sources:
  - src/core/orchestrator.py
  - src/data/fetch_pipeline.py
steps:
  - id: fetch
    label: 数据拉取
    module: src/data/fetch_pipeline.py
    function: fetch_all_data
    uses_llm: false
    progress: true
  - id: indicators
    label: 计算技术指标
    module: src/indicators/technical.py
    function: enrich
    uses_llm: false
    progress: true
  - id: structure
    label: 提取市场结构
    module: src/analysis/ict_pa.py
    function: analyze_timeframe
    uses_llm: false
    progress: true
  - id: advice
    label: 生成人工审核建议
    module: src/advice/engine.py
    function: build_advice_packet
    uses_llm: optional-wording-only
    progress: true
  - id: report
    label: 组装人工审核卡
    module: src/advice/report.py
    function: build_advice_report
    uses_llm: false
    progress: true
  - id: archive
    label: 运行归档
    module: src/run/archive/store.py
    function: archive_run
    uses_llm: false
    progress: false
replay:
  entry: src/viz/replay_loader.py::load_replay_bundle
  storage: .cache/run_archives/
  uses_llm: false
  uses_fetch: false
  note: V2 reports load directly; legacy archives rebuild V2 from stored data and analyses.
