schema_version: 2
baseline_id: ASPICE-SAD-ADVICE-V2-2026-08-12
status: agreed
owner_role: software-architect
analysis_criteria:
  - requirements_coverage
  - interface_completeness
  - deterministic_testability
  - failure_isolation
  - data_freshness
  - auditability
  - configuration_reproducibility
modes:
  - id: MODE-DETERMINISTIC
    behavior: Generate Advice V2 entirely from reproducible market facts and deterministic policy.
  - id: MODE-LLM-WORDING
    behavior: Generate deterministic Advice V2 first, then permit one constrained prose-only LLM pass.
  - id: MODE-REPLAY
    behavior: Load or reconstruct Advice V2 from an archive without new supplier or LLM calls.
components:
  - id: ARC-APP
    name: Application entry and run selection
    source_globs: [app.py, run_app.py, views/**]
    static_interfaces: [application entry]
    dynamic_behavior: Starts Streamlit, selects deterministic, wording or replay mode, and owns session-level generation state.
    requirements: [SWR-CORE-002, SWR-UI-001, SWR-CFG-001]
  - id: ARC-CORE
    name: Advice pipeline orchestration
    source_globs: [src/core/**, src/pipeline.py]
    static_interfaces: [run_advice_pipeline]
    dynamic_behavior: Orders fetch, indicators, structure, advice, report and archive stages and publishes progress and audit metadata.
    requirements: [SWR-CORE-001, SWR-CORE-002, SWR-REP-001, SWR-ARC-001, SWR-NFR-002]
  - id: ARC-DATA
    name: Market and external data
    source_globs: [src/data/**]
    static_interfaces: [MarketContext]
    dynamic_behavior: Acquires, normalizes and aligns market and external inputs while preserving source, error and as-of semantics.
    requirements: [SWR-CORE-001, SWR-DATA-001, SWR-DATA-002, SWR-DATA-003, SWR-NFR-001]
  - id: ARC-INDICATORS
    name: Technical indicator enrichment
    source_globs: [src/indicators/**]
    static_interfaces: [enrich]
    dynamic_behavior: Computes reproducible technical columns and input-quality snapshots from timeframe OHLCV frames.
    requirements: [SWR-ANA-001]
  - id: ARC-ANALYSIS
    name: Point-in-time market structure
    source_globs: [src/analysis/**]
    static_interfaces: [TimeframeAnalysis]
    dynamic_behavior: Derives PA/ICT structure, support, resistance, liquidity and freshness facts without creating a trade authorization.
    requirements: [SWR-DATA-003, SWR-ANA-001]
  - id: ARC-ADVICE
    name: Human-review advice engine
    source_globs: [src/advice/**]
    static_interfaces: [AdvicePacket]
    dynamic_behavior: Reduces source-backed facts to one watch setup or an explicit WAIT/AVOID result, audits geometry and composes artifact version 2.
    requirements: [SWR-CORE-001, SWR-DATA-002, SWR-DATA-003, SWR-ADV-001, SWR-ADV-002, SWR-ADV-003, SWR-ADV-004, SWR-LLM-001, SWR-LLM-002, SWR-REP-001, SWR-UI-002, SWR-NFR-001, SWR-NFR-002]
  - id: ARC-LLM
    name: Optional advice wording service
    source_globs: [src/llm/**]
    static_interfaces: [advisor wording pass]
    dynamic_behavior: Calls one configured model with bounded retry and budget policy, validates prose-only output and records telemetry.
    requirements: [SWR-LLM-001, SWR-LLM-002, SWR-CFG-001, SWR-NFR-001]
  - id: ARC-RUN
    name: Run configuration and archives
    source_globs: [src/run/**]
    static_interfaces: [archive bundle]
    dynamic_behavior: Binds immutable run configuration, atomically persists Advice V2 bundles and reconstructs V2 from compatible legacy data.
    requirements: [SWR-CORE-001, SWR-CORE-002, SWR-REP-001, SWR-ARC-001, SWR-ARC-002, SWR-CFG-001, SWR-NFR-002, SWR-NFR-004]
  - id: ARC-VIZ
    name: Human-review presentation
    source_globs: [src/viz/**]
    static_interfaces: [render_advice]
    dynamic_behavior: Presents the compact advice, evidence, audit, uncertainty, external context, LLM generation telemetry and replay state without execution controls.
    requirements: [SWR-ADV-002, SWR-ADV-004, SWR-ARC-002, SWR-UI-001, SWR-UI-002]
  - id: ARC-TOOLS
    name: Development and ASPICE tooling
    source_globs: [scripts/**]
    static_interfaces: [quality evidence CLI]
    dynamic_behavior: Runs connection diagnostics, archive inspection, sample export and deterministic ASPICE generation and validation.
    requirements: [SWR-NFR-003, SWR-NFR-004]
component_interfaces:
  - component_id: ARC-APP
    name: application entry
    kind: command
    purpose: Start the controlled Streamlit process and select a run configuration.
    parameters: Optional port plus environment-backed configuration and Streamlit session state.
    returns: Running application process and selected immutable RunConfig.
    failures: Missing runtime dependency or invalid configuration is reported before pipeline execution.
  - component_id: ARC-CORE
    name: run_advice_pipeline
    kind: function
    purpose: Execute the complete Advice V2 production sequence.
    parameters: Thread-local RunConfig and optional ProgressReporter.
    returns: Advice V2 report, enriched timeframe frames and timeframe analyses.
    failures: Stage failure is published and archived; no fabricated success report is returned.
  - component_id: ARC-DATA
    name: MarketContext
    kind: data
    purpose: Transfer aligned market and external input with source and quality metadata.
    parameters: Enriched frames, timeframe analyses, metrics, current price, external factors and source label.
    returns: Frozen context consumed by the advice engine.
    failures: Missing or stale inputs retain explicit status rather than masquerading as current facts.
  - component_id: ARC-INDICATORS
    name: enrich
    kind: function
    purpose: Add deterministic technical columns to one OHLCV frame.
    parameters: Time-ordered OHLCV DataFrame.
    returns: DataFrame with configured technical indicators.
    failures: Invalid columns or insufficient rows remain visible through exceptions or readiness notes.
  - component_id: ARC-ANALYSIS
    name: TimeframeAnalysis
    kind: data
    purpose: Transfer point-in-time structure and volatility facts for one timeframe.
    parameters: Trend, swings, ATR, PA/ICT structures, liquidity and volume state.
    returns: Reproducible structured analysis object.
    failures: Insufficient history produces neutral or explicitly unavailable facts.
  - component_id: ARC-ADVICE
    name: AdvicePacket
    kind: data
    purpose: Represent one falsifiable suggestion for human confirmation or an explicit no-setup decision.
    parameters: Decision, bias, confidence, setup, alternative scenario, evidence, risks, uncertainty and audit.
    returns: Versioned serializable Advice V2 payload.
    failures: Audit violations degrade the candidate to AVOID and preserve violations.
  - component_id: ARC-LLM
    name: advisor wording pass
    kind: service
    purpose: Improve only the prose fields of deterministic advice.
    parameters: Whitelisted AdvicePacket text fields and immutable numeric context.
    returns: Validated prose plus LLMStageTrace, or deterministic fallback.
    failures: Transport, JSON, budget, invented-price or audit failure retains deterministic wording.
  - component_id: ARC-RUN
    name: archive bundle
    kind: data
    purpose: Persist and reload reproducible pipeline inputs, outputs and status.
    parameters: Manifest, RunConfig, report, fetch snapshot, enriched data and analyses.
    returns: Validated archive bundle or explicit compatibility diagnosis.
    failures: Atomic failure archive is written where possible; incompatible legacy advice is not displayed.
  - component_id: ARC-VIZ
    name: render_advice
    kind: presentation
    purpose: Present the decision contract and the facts needed for manual confirmation.
    parameters: Advice V2 report and session/replay state.
    returns: Streamlit advice, evidence, risk, audit and external-data components.
    failures: Missing optional sections degrade to explanatory empty state rather than execution controls.
  - component_id: ARC-TOOLS
    name: quality evidence CLI
    kind: command
    purpose: Generate and validate controlled software evidence and sample artifacts.
    parameters: Read-only repository inputs plus write or check mode.
    returns: Controlled docs/aspice outputs and process exit status.
    failures: Stale, missing or inconsistent assets return non-zero without altering product behavior.
interfaces:
  - id: IF-DATA-CONTEXT
    providers: [ARC-DATA, ARC-INDICATORS]
    consumers: [ARC-ANALYSIS, ARC-ADVICE]
    purpose: Supply aligned market frames, technical enrichment and external background with time semantics.
    parameters: OHLCV frames, indicators, external factors, current price and data-as-of metadata.
    returns: MarketContext-compatible point-in-time input.
    failures: Missing, future or stale data carries explicit quality state and triggers deterministic degradation.
    contract: Time indexes are timezone-aware and current price is anchored to the same-batch 5m close.
  - id: IF-CONTEXT-ADVICE
    providers: [ARC-DATA, ARC-ANALYSIS]
    consumers: [ARC-ADVICE]
    purpose: Transfer source-backed structure facts and candidate support/resistance levels to the advice policy.
    parameters: MarketContext, TimeframeAnalysis objects and level rows with timeframe and source.
    returns: Inputs sufficient to form one confluence-backed setup or no setup.
    failures: Direction conflict, isolated levels or absent targets produce WAIT; stale data produces AVOID.
    contract: Narrative external data cannot directly create entry, invalidation or target prices.
  - id: IF-ADVICE-LLM
    providers: [ARC-ADVICE]
    consumers: [ARC-LLM]
    purpose: Offer only explanatory fields for one optional constrained wording pass.
    parameters: Deterministic AdvicePacket and a whitelist of permitted numeric values.
    returns: Prose replacements and telemetry.
    failures: Any new setup, price, malformed payload or failed audit is rejected.
    contract: Decision, bias, confidence, direction and all numeric values are immutable.
  - id: IF-ADVICE-REPORT
    providers: [ARC-ADVICE]
    consumers: [ARC-CORE, ARC-RUN, ARC-VIZ]
    purpose: Publish one audited human-review artifact to orchestration, archive and presentation.
    parameters: AdvicePacket, MarketContext, run ID and RunConfig fingerprint.
    returns: artifact_kind human_review_advice, artifact_version 2 report.
    failures: A failed candidate audit cannot be published as WATCH_LONG or WATCH_SHORT.
    contract: Required sections are meta, metrics, advice, timeframes, levels and external; V1 keys are prohibited.
  - id: IF-REPORT-ARCHIVE
    providers: [ARC-CORE]
    consumers: [ARC-RUN, ARC-VIZ]
    purpose: Preserve and display the same completed report snapshot.
    parameters: Versioned report and generation metadata.
    returns: Reproducible persisted and rendered Advice V2 result.
    failures: Archive failure is explicit; legacy V1 narrative is never treated as active advice.
    contract: Replay performs no new supplier fetch or LLM call.
