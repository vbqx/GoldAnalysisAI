schema_version: 2
baseline_id: ASPICE-VER-ADVICE-V2-2026-08-12
status: agreed
owner_role: verification-lead
selection_policy:
  release_scope: Advice V2 source, tests, configuration and controlled documentation.
  regression_rule: Unit, regression, documentation, trace and static measures block release; live supplier health is classified separately.
  entry_criteria: Requirements, architecture and interfaces are agreed and deterministic fixtures are available.
  exit_criteria: Every requirement has an accepted verification disposition and no blocking failure remains.
measures:
  - id: VM-UNIT
    level: SWE.4
    technique: automated unit testing
    command: python tests/run.py --unit
    pass_fail: pytest exit code 0
    environment: CPython 3.12, no network
    result_record: docs/aspice/records/verification/latest.md
  - id: VM-REGRESSION
    level: SWE.6
    technique: automated regression testing
    command: python tests/run.py --regression
    pass_fail: pytest exit code 0
    environment: CPython 3.12, no network
    result_record: docs/aspice/records/verification/latest.md
  - id: VM-INTEGRATION-PIPELINE
    level: SWE.5
    technique: deterministic Advice V2 cross-component contract integration
    command: python -m pytest tests/integration/test_offline_report_contract.py -m integration
    pass_fail: pytest exit code 0 within declared timeout
    environment: frozen fixtures; no network or paid LLM
    result_record: docs/aspice/records/verification/latest.md
  - id: VM-INTEGRATION-EXTERNAL
    level: SWE.5
    technique: live supplier health smoke
    command: python tests/run.py --external
    pass_fail: result classified as pass, supplier unavailable, or software failure; only software failure blocks release
    environment: network required; separate from deterministic offline gate
    result_record: runtime ledger or dedicated live-smoke record
  - id: VM-DOCS
    level: SWE.6
    technique: documentation structure, links, pipeline and sample synchronization
    command: python tests/run.py --regression
    pass_fail: documentation regression tests exit 0
    environment: no network
    result_record: docs/aspice/records/verification/latest.md
  - id: VM-TRACE
    level: SWE.1-SWE.6
    technique: bidirectional traceability and document-register validation
    command: python scripts/check_aspice_assets.py --check and python scripts/generate_aspice_software_evidence.py --check
    pass_fail: exit code 0 with no orphan or dangling identifier
    environment: no network; PyYAML available
    result_record: docs/aspice/records/verification/latest.md
  - id: VM-STATIC
    level: SWE.4
    technique: compile and patch hygiene
    command: python -m compileall -q src app.py run_app.py scripts and git diff --check
    pass_fail: both commands exit code 0
    environment: no network
    result_record: docs/aspice/records/verification/latest.md
  - id: VM-MANUAL-UI
    level: SWE.6
    technique: Streamlit visual and interaction acceptance
    command: python run_app.py
    pass_fail: Advice V2 UI catalog cases pass with screenshots or review notes
    environment: supported browser at desktop and mobile widths
    result_record: docs/aspice/records/reviews/gui/advice-v2-acceptance-2026-08-12.md
  - id: VM-CONFIG
    level: SUP.8
    technique: configuration item, dependency lock and SBOM consistency
    command: python scripts/check_aspice_assets.py --check
    pass_fail: controlled paths exist and dependency lock equals SBOM versions
    environment: no network
    result_record: docs/aspice/records/verification/latest.md
requirements:
  VM-UNIT: [SWR-CORE-001, SWR-CORE-002, SWR-DATA-001, SWR-DATA-002, SWR-DATA-003, SWR-ANA-001, SWR-ADV-001, SWR-ADV-002, SWR-ADV-003, SWR-ADV-004, SWR-LLM-001, SWR-LLM-002, SWR-REP-001, SWR-ARC-001, SWR-ARC-002, SWR-UI-001, SWR-UI-002, SWR-CFG-001, SWR-NFR-001, SWR-NFR-002, SWR-NFR-003]
  VM-REGRESSION: [SWR-CORE-001, SWR-CORE-002, SWR-DATA-003, SWR-ANA-001, SWR-ADV-001, SWR-ADV-002, SWR-ADV-003, SWR-ADV-004, SWR-LLM-002, SWR-REP-001, SWR-ARC-001, SWR-ARC-002, SWR-NFR-002, SWR-NFR-003]
  VM-INTEGRATION-PIPELINE: [SWR-CORE-001, SWR-ADV-001, SWR-ADV-002, SWR-ADV-003, SWR-LLM-001]
  VM-INTEGRATION-EXTERNAL: [SWR-DATA-001, SWR-DATA-002, SWR-NFR-001]
  VM-DOCS: [SWR-REP-001, SWR-NFR-003]
  VM-TRACE: [SWR-NFR-003, SWR-NFR-004]
  VM-STATIC: [SWR-NFR-003]
  VM-MANUAL-UI: [SWR-UI-001, SWR-UI-002]
  VM-CONFIG: [SWR-CFG-001, SWR-NFR-004]
