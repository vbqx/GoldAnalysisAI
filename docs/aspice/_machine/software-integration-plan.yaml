schema_version: 2
baseline_id: ASPICE-SWE5-ADVICE-V2-2026-08-12
status: agreed
scope: Advice V2 deterministic component and interface integration
entry_criteria:
  - linked software requirements and architecture interfaces are agreed
  - unit verification selection has no blocking gap
  - frozen fixtures are available and external suppliers and paid LLM calls are disabled
exit_criteria:
  - every planned integration item has a verification measure and disposition
  - deterministic integration tests pass within the declared timeout
  - supplier-unavailable results remain separate from software failures
integration_order:
  - INT-01-CONFIG-CORE
  - INT-02-DATA-STRUCTURE
  - INT-03-CONTEXT-ADVICE
  - INT-04-ADVICE-LLM
  - INT-05-REPORT-ARCHIVE
  - INT-06-REPORT-VIZ
items:
  - id: INT-01-CONFIG-CORE
    providers: [ARC-APP, ARC-RUN]
    consumers: [ARC-CORE]
    interfaces: [application entry, run_advice_pipeline]
    requirement_ids: [SWR-CORE-001, SWR-CORE-002, SWR-CFG-001, SWR-NFR-002]
    prerequisites: frozen environment and temporary archive root
    stubs: environment and filesystem are isolated by pytest fixtures
    timeout_seconds: 30
    resource_target: no network and no background service
    tests: [tests/unit/test_run_config.py, tests/unit/test_orchestrator_hooks.py]
    verification_measure_ids: [VM-UNIT, VM-REGRESSION]
    result: pass-in-current-baseline
  - id: INT-02-DATA-STRUCTURE
    providers: [ARC-DATA, ARC-INDICATORS]
    consumers: [ARC-ANALYSIS, ARC-ADVICE]
    interfaces: [IF-DATA-CONTEXT]
    requirement_ids: [SWR-DATA-001, SWR-DATA-002, SWR-DATA-003, SWR-ANA-001]
    prerequisites: frozen OHLCV and mocked external responses
    stubs: external HTTP is monkeypatched; live health is a separate measure
    timeout_seconds: 30
    resource_target: no network and bounded fixture frames
    tests: [tests/unit/test_indicators.py, tests/unit/test_data_freshness.py, tests/unit/test_technical_context_lux.py]
    verification_measure_ids: [VM-UNIT, VM-INTEGRATION-EXTERNAL]
    result: pass-deterministic;live-smoke-separate
  - id: INT-03-CONTEXT-ADVICE
    providers: [ARC-DATA, ARC-ANALYSIS]
    consumers: [ARC-ADVICE]
    interfaces: [IF-CONTEXT-ADVICE, AdvicePacket]
    requirement_ids: [SWR-ADV-001, SWR-ADV-002, SWR-ADV-003, SWR-ADV-004]
    prerequisites: frozen aligned bullish, bearish, conflicting and stale contexts
    stubs: no external dependency
    timeout_seconds: 30
    resource_target: deterministic and zero network
    tests: [tests/unit/test_advice_v2.py, tests/integration/test_offline_report_contract.py]
    verification_measure_ids: [VM-UNIT, VM-INTEGRATION-PIPELINE]
    result: pass-in-current-baseline
  - id: INT-04-ADVICE-LLM
    providers: [ARC-ADVICE]
    consumers: [ARC-LLM]
    interfaces: [IF-ADVICE-LLM, advisor wording pass]
    requirement_ids: [SWR-LLM-001, SWR-LLM-002, SWR-NFR-001]
    prerequisites: deterministic AdvicePacket and mocked LLM transport
    stubs: model responses and transport errors are fully controlled
    timeout_seconds: 30
    resource_target: zero paid tokens and no network
    tests: [tests/unit/test_advice_v2.py, tests/unit/test_llm_stage_policy.py]
    verification_measure_ids: [VM-UNIT, VM-REGRESSION]
    result: pass-in-current-baseline
  - id: INT-05-REPORT-ARCHIVE
    providers: [ARC-ADVICE, ARC-CORE]
    consumers: [ARC-RUN]
    interfaces: [IF-ADVICE-REPORT, IF-REPORT-ARCHIVE, archive bundle]
    requirement_ids: [SWR-REP-001, SWR-ARC-001, SWR-ARC-002, SWR-NFR-002]
    prerequisites: temporary archive root and deterministic V2 and legacy fixtures
    stubs: filesystem redirected to pytest temporary directory
    timeout_seconds: 30
    resource_target: atomic local writes and no network
    tests: [tests/unit/test_archive_compat.py, tests/unit/test_archive_optimizations.py, tests/unit/test_archive_transfer.py, tests/integration/test_offline_report_contract.py]
    verification_measure_ids: [VM-UNIT, VM-REGRESSION]
    result: pass-in-current-baseline
  - id: INT-06-REPORT-VIZ
    providers: [ARC-ADVICE, ARC-RUN]
    consumers: [ARC-VIZ, ARC-APP]
    interfaces: [IF-ADVICE-REPORT, IF-REPORT-ARCHIVE, render_advice]
    requirement_ids: [SWR-ADV-002, SWR-ADV-004, SWR-UI-001, SWR-UI-002]
    prerequisites: frozen Advice V2 report and replay fixtures
    stubs: Streamlit rendering uses test doubles where automated
    timeout_seconds: 60
    resource_target: no supplier network
    tests: [tests/unit/test_external_data_view.py, tests/unit/test_llm_process_view.py, tests/unit/test_live_llm_process_panel.py, tests/regression/test_export_sample_report.py]
    verification_measure_ids: [VM-UNIT, VM-REGRESSION, VM-MANUAL-UI]
    result: pass-automated;manual-review-required-for-new-baseline
