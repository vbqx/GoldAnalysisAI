schema_version: 2
baseline_id: ASPICE-SWR-ADVICE-V2-2026-08-12
status: agreed
owner_role: product-owner
change_control: SUP.10
agreement_evidence:
  - Product direction confirmed as human-reviewed trading suggestions, not automatic execution
  - Advice V2 re-architecture review dated 2026-08-12
attribute_definitions:
  priority: [P0, P1, P2, P3]
  type: [functional, performance, reliability, security, maintainability, compatibility]
  status: [draft, reviewed, agreed, retired]
requirements:
  - id: SWR-CORE-001
    title: Advice V2 analysis pipeline
    text: The system shall execute data acquisition, indicator enrichment, market-structure extraction, advice generation, report composition and archive persistence in a controlled order, returning the report, enriched frames and timeframe analyses.
    type: functional
    priority: P0
    status: agreed
    source: docs/aspice/records/reviews/financial/advice-v2-rearchitecture-2026-08-12.md
    verification_criteria: Deterministic integration tests demonstrate the ordered pipeline and an Advice V2 artifact result.
    operating_environment_impact: CPython 3.12; Windows primary development environment and Linux CI.
    architecture_ids: [ARC-CORE, ARC-DATA, ARC-ADVICE, ARC-RUN]
    verification_ids: [VM-UNIT, VM-REGRESSION, VM-INTEGRATION-PIPELINE]
  - id: SWR-CORE-002
    title: Controlled run modes
    text: The system shall support deterministic advice, optional LLM wording enhancement and archive replay using an immutable per-run configuration; replay shall not fetch new data or invoke an LLM.
    type: functional
    priority: P1
    status: agreed
    source: docs/aspice/SWE.2-architecture/system-overview.md
    verification_criteria: Configuration tests cover defaults, normalization, legacy hybrid mapping, replay isolation and fingerprints.
    operating_environment_impact: Environment variables come from .env or the host and secrets shall not be written into reports.
    architecture_ids: [ARC-APP, ARC-CORE, ARC-RUN]
    verification_ids: [VM-UNIT, VM-REGRESSION]
  - id: SWR-DATA-001
    title: Multi-timeframe XAUUSD market data
    text: The system shall acquire and normalize 5m, 15m, 1h, 4h and 1d OHLCV data with source and timestamp semantics; current price shall be anchored to the latest 5m close in the same batch.
    type: functional
    priority: P0
    status: agreed
    source: docs/aspice/SWE.2-architecture/technical-analysis.md
    verification_criteria: Data tests verify columns, ordering, timeframe coverage, degradation and current-price alignment.
    operating_environment_impact: Live acquisition depends on configured market-data suppliers and UTC timestamp semantics.
    architecture_ids: [ARC-DATA]
    verification_ids: [VM-UNIT, VM-INTEGRATION-EXTERNAL]
  - id: SWR-DATA-002
    title: External data as background context
    text: The system shall acquire or explicitly degrade DXY, yield, news, calendar and social sources, retain source and error metadata, and prevent external narrative data from directly creating entry prices.
    type: reliability
    priority: P1
    status: agreed
    source: docs/aspice/records/reviews/financial/advice-v2-rearchitecture-2026-08-12.md
    verification_criteria: Tests cover success, confirmed-empty, timeout, unavailable and source-policy behavior.
    operating_environment_impact: Supplier availability is external; live smoke results are separated from deterministic release gates.
    architecture_ids: [ARC-DATA, ARC-ADVICE]
    verification_ids: [VM-UNIT, VM-INTEGRATION-EXTERNAL]
  - id: SWR-DATA-003
    title: Data freshness and as-of control
    text: The system shall calculate data-as-of and freshness state and shall produce AVOID rather than a watch setup when the market snapshot does not satisfy freshness requirements.
    type: reliability
    priority: P0
    status: agreed
    source: docs/aspice/SWE.2-architecture/human-review-advice.md
    verification_criteria: Fixed-clock tests cover fresh, stale, closed-market, future-data and timezone boundaries.
    operating_environment_impact: Internal comparisons use timezone-aware UTC values.
    architecture_ids: [ARC-DATA, ARC-ANALYSIS, ARC-ADVICE]
    verification_ids: [VM-UNIT, VM-REGRESSION]
  - id: SWR-ANA-001
    title: Reproducible market-structure facts
    text: The system shall calculate indicators, PA/ICT structure, liquidity, support and resistance from point-in-time data and retain timeframe and source semantics for facts used by advice.
    type: functional
    priority: P0
    status: agreed
    source: docs/aspice/SWE.2-architecture/technical-analysis.md
    verification_criteria: Deterministic fixtures cover normal, inverse, boundary, insufficient-history and no-future-data cases.
    operating_environment_impact: pandas and numpy versions and resampling semantics are configuration-baseline items.
    architecture_ids: [ARC-INDICATORS, ARC-ANALYSIS]
    verification_ids: [VM-UNIT, VM-REGRESSION]
  - id: SWR-ADV-001
    title: Exactly one primary suggestion or no setup
    text: The system shall emit exactly one decision from WAIT, WATCH_LONG, WATCH_SHORT or AVOID and shall include at most one primary setup; it shall never authorize or execute a trade.
    type: functional
    priority: P0
    status: agreed
    source: docs/aspice/records/reviews/financial/advice-v2-rearchitecture-2026-08-12.md
    verification_criteria: Advice tests cover aligned bullish, aligned bearish, conflicting and unavailable scenarios and reject V1 execution semantics.
    operating_environment_impact: Output is for manual review only.
    architecture_ids: [ARC-ADVICE]
    verification_ids: [VM-UNIT, VM-REGRESSION, VM-INTEGRATION-PIPELINE]
  - id: SWR-ADV-002
    title: Human-confirmable setup
    text: A watch setup shall include an attention zone, current state, rationale, an observable confirmation checklist, invalidation condition and level, no more than two targets, evidence identifiers and reward-risk values.
    type: functional
    priority: P0
    status: agreed
    source: docs/aspice/SWE.2-architecture/human-review-advice.md
    verification_criteria: Contract tests assert every required field, cardinality and evidence reference.
    operating_environment_impact: All prices use XAUUSD quote units; display rounding shall not change validation geometry.
    architecture_ids: [ARC-ADVICE, ARC-VIZ]
    verification_ids: [VM-UNIT, VM-REGRESSION, VM-INTEGRATION-PIPELINE]
  - id: SWR-ADV-003
    title: Deterministic advice audit
    text: Before publication the system shall validate decision-direction alignment, attention-zone geometry, invalidation placement, target ordering, evidence references and checklist presence; failed audits shall degrade to AVOID.
    type: reliability
    priority: P0
    status: agreed
    source: docs/aspice/SWE.2-architecture/human-review-advice.md
    verification_criteria: Boundary tests cover BUY and SELL geometry, missing evidence, missing checklist and audit degradation.
    operating_environment_impact: The audit is offline deterministic code and does not depend on LLM availability.
    architecture_ids: [ARC-ADVICE]
    verification_ids: [VM-UNIT, VM-REGRESSION, VM-INTEGRATION-PIPELINE]
  - id: SWR-ADV-004
    title: Evidence and uncertainty disclosure
    text: Advice shall distinguish source-backed evidence, risks and uncertainties and shall use WAIT or AVOID when directional agreement, confluence or target space is insufficient.
    type: reliability
    priority: P1
    status: agreed
    source: docs/aspice/SWE.2-architecture/human-review-advice.md
    verification_criteria: Tests cover higher-timeframe conflict, isolated levels, absent targets and stale data.
    operating_environment_impact: Confidence is a qualitative evidence grade, not a historical win probability.
    architecture_ids: [ARC-ADVICE, ARC-VIZ]
    verification_ids: [VM-UNIT, VM-REGRESSION]
  - id: SWR-LLM-001
    title: Single constrained wording pass
    text: When enabled, the system shall perform one optional LLM pass limited to editing explanatory text and shall record model, latency, retry, budget and usage telemetry.
    type: functional
    priority: P1
    status: agreed
    source: docs/aspice/SWE.2-architecture/human-review-advice.md
    verification_criteria: Mock-client tests cover success, transport failure, invalid JSON, retry exhaustion and telemetry.
    operating_environment_impact: The pass uses an OpenAI-compatible external API; paid calls are excluded from deterministic gates.
    architecture_ids: [ARC-LLM, ARC-ADVICE]
    verification_ids: [VM-UNIT, VM-INTEGRATION-PIPELINE]
  - id: SWR-LLM-002
    title: LLM immutability and fallback
    text: LLM output shall not change decision, bias, confidence, direction or any numeric value and shall not invent a setup or price; rejected or failed output shall preserve deterministic advice.
    type: reliability
    priority: P0
    status: agreed
    source: docs/aspice/SWE.2-architecture/human-review-advice.md
    verification_criteria: Tests inject changed numbers, invented setup fields and malformed output and verify deterministic fallback.
    operating_environment_impact: LLM availability cannot prevent deterministic Advice V2 generation.
    architecture_ids: [ARC-LLM, ARC-ADVICE]
    verification_ids: [VM-UNIT, VM-REGRESSION]
  - id: SWR-REP-001
    title: Versioned human-review report
    text: The system shall publish artifact_kind human_review_advice with artifact_version 2 and the meta, metrics, advice, timeframes, levels and external sections; V1 agent_trace, signals, projections and validated_plans shall be absent.
    type: functional
    priority: P0
    status: agreed
    source: docs/aspice/SWE.3-detailed-design/reference/examples/report-schema.md
    verification_criteria: Unit and sample-export regression tests verify required and prohibited fields.
    operating_environment_impact: Contract-breaking changes require an artifact-version increment.
    architecture_ids: [ARC-ADVICE, ARC-CORE, ARC-RUN]
    verification_ids: [VM-UNIT, VM-DOCS, VM-REGRESSION]
  - id: SWR-ARC-001
    title: Run archive persistence
    text: The system shall archive run configuration, manifest, Advice V2 report, analyses, data summary and status with atomic local-file behavior and support listing, loading, transfer and retention.
    type: functional
    priority: P1
    status: agreed
    source: docs/aspice/SWE.3-detailed-design/reference/run-archive-schema.md
    verification_criteria: Archive tests cover success, failure, atomic write, index, transfer and pruning.
    operating_environment_impact: The configured data directory must be writable.
    architecture_ids: [ARC-RUN, ARC-CORE]
    verification_ids: [VM-UNIT, VM-REGRESSION]
  - id: SWR-ARC-002
    title: Legacy archive reconstruction
    text: Replay shall load an Advice V2 report directly or reconstruct Advice V2 from stored market data and analyses in a legacy archive; legacy V1 report recommendations shall not be displayed as active advice.
    type: compatibility
    priority: P1
    status: agreed
    source: docs/aspice/SWE.3-detailed-design/reference/run-archive-schema.md
    verification_criteria: Compatibility fixtures cover V2, legacy reconstruction, missing payloads and incompatible archives without new fetch or LLM calls.
    operating_environment_impact: Historical archives may originate from different Git revisions and schema versions.
    architecture_ids: [ARC-RUN, ARC-VIZ]
    verification_ids: [VM-UNIT, VM-REGRESSION]
  - id: SWR-UI-001
    title: Human-review advice interface
    text: The Streamlit application shall make the compact advice card the primary view and provide external-data, optional LLM thinking-process audit and replay access without V1 strategy, debate or decision-chain pages.
    type: functional
    priority: P1
    status: agreed
    source: docs/aspice/records/reviews/financial/advice-v2-rearchitecture-2026-08-12.md
    verification_criteria: UI helper tests and manual acceptance cover navigation, generation, replay, advice presentation and LLM telemetry audit.
    operating_environment_impact: The application is launched through run_app.py.
    architecture_ids: [ARC-APP, ARC-VIZ]
    verification_ids: [VM-UNIT, VM-MANUAL-UI]
  - id: SWR-UI-002
    title: Manual-confirmation disclosure
    text: The interface shall clearly state that suggestions require human confirmation and are not automatically executed, and shall expose evidence, uncertainty, audit state, invalidation and alternative scenario where applicable.
    type: reliability
    priority: P0
    status: agreed
    source: docs/aspice/SWE.2-architecture/human-review-advice.md
    verification_criteria: Component tests and manual review verify disclosure and audit-detail accessibility.
    operating_environment_impact: Text must remain readable at supported desktop and mobile widths.
    architecture_ids: [ARC-VIZ, ARC-ADVICE]
    verification_ids: [VM-UNIT, VM-MANUAL-UI]
  - id: SWR-CFG-001
    title: Configuration and secret handling
    text: Runtime supplier, LLM, timeout and archive settings shall come from controlled environment configuration, with secrets disabled by default in examples and excluded from reports and logs; the controlled template documents SiliconFlow DeepSeek-V4-Flash as the default optional wording provider.
    type: security
    priority: P0
    status: agreed
    source: docs/operations/setup.md
    verification_criteria: Configuration tests and secret scans verify defaults, URL sanitization and controlled examples.
    operating_environment_impact: Production credentials are supplied outside version control.
    architecture_ids: [ARC-APP, ARC-LLM, ARC-RUN]
    verification_ids: [VM-UNIT, VM-CONFIG]
  - id: SWR-NFR-001
    title: Fault isolation and graceful degradation
    text: Supplier and optional LLM failures shall be bounded by timeout, recorded explicitly and degraded without fabricating facts or losing deterministic advice when sufficient market data remains.
    type: reliability
    priority: P0
    status: agreed
    source: docs/management/audit-plan.md
    verification_criteria: Fault-injection tests cover timeout, empty result, invalid JSON, HTTP errors and partial external data.
    operating_environment_impact: Network supplier availability is not controlled by the software.
    architecture_ids: [ARC-DATA, ARC-ADVICE, ARC-LLM]
    verification_ids: [VM-UNIT, VM-INTEGRATION-EXTERNAL]
  - id: SWR-NFR-002
    title: Auditability and reproducibility
    text: Each run shall retain data source, data-as-of, run configuration fingerprint, generation steps, advice source, deterministic audit and optional LLM telemetry sufficient to explain the result.
    type: maintainability
    priority: P0
    status: agreed
    source: docs/management/audit-plan.md
    verification_criteria: Report, progress and archive tests verify stable and complete metadata.
    operating_environment_impact: Archive retention is bounded by configured count and size limits.
    architecture_ids: [ARC-CORE, ARC-ADVICE, ARC-RUN]
    verification_ids: [VM-UNIT, VM-REGRESSION]
  - id: SWR-NFR-003
    title: Automated quality gate
    text: Source, tests, documentation and configuration changes shall pass unit, regression, documentation, traceability and static-hygiene checks before release.
    type: maintainability
    priority: P0
    status: agreed
    source: .github/workflows/quality.yml
    verification_criteria: The declared commands complete with zero blocking failure.
    operating_environment_impact: CI runs on a supported CPython environment with deterministic tests offline.
    architecture_ids: [ARC-TOOLS]
    verification_ids: [VM-UNIT, VM-REGRESSION, VM-DOCS, VM-TRACE, VM-STATIC]
  - id: SWR-NFR-004
    title: Configuration-management evidence
    text: The project shall maintain controlled configuration items, exact dependency resolution, SBOM, document register and bidirectional requirement-to-architecture-to-verification traceability.
    type: maintainability
    priority: P1
    status: agreed
    source: docs/aspice/_machine/configuration-management.yaml
    verification_criteria: Configuration and trace checks report no missing path, orphan identifier or dependency mismatch.
    operating_environment_impact: Generated evidence is deterministic for the same repository baseline.
    architecture_ids: [ARC-TOOLS, ARC-RUN]
    verification_ids: [VM-CONFIG, VM-TRACE]
